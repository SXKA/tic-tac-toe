name: Delete merged branches

# Deletes a pull request's branch once the pull request is merged (what the
# "Automatically delete head branches" setting does). When this file first
# lands on the default branch, or when run by hand, it also deletes every
# branch whose pull requests are all merged or closed.
on:
  pull_request:
    types: [closed]
  push:
    branches: [main, master]
    paths: [.github/workflows/delete-merged-branches.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged pull request's branch
        if: github.event_name == 'pull_request' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || echo "$BRANCH is already gone"
      - name: Delete every finished branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          default=$(gh api "repos/$REPO" --jq .default_branch)
          owner=${REPO%%/*}
          gh api "repos/$REPO/branches" --paginate --jq '.[].name' | while read -r branch; do
            [ "$branch" = "$default" ] && continue
            open=$(gh api "repos/$REPO/pulls?state=open&head=$owner:$branch" --jq length)
            closed=$(gh api "repos/$REPO/pulls?state=closed&head=$owner:$branch" --jq length)
            if [ "$open" = 0 ] && [ "$closed" -gt 0 ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" && echo "deleted $branch"
            else
              echo "kept $branch"
            fi
          done
